name: Veridata-Client-Tools
services:
  client-tools:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veridata-client-tools
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    environment:
      PORT: 3000
      DB_PATH: /app/data/app.db
    volumes:
      - ./public:/app/public
      - ./backend/app:/app/backend/app
      - ./data:/app/data
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/backend/app
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./docker-compose.yml
    expose:
      - "3000"
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      veridata.network:
        aliases:
          - client.tools

networks:
  veridata.network:
    external: true
    name: veridata.network
